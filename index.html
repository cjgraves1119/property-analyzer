const fmt = (v) => {
    const n = parseFloat(v);
    return isNaN(n) ? '$0' : '$' + n.toLocaleString('en-US', { minimumFractionDigits: 0, maximumFractionDigits: 0 });
};
const fmtDec = (v, d = 2) => {
    const n = parseFloat(v);
    return isNaN(n) ? '0' : n.toLocaleString('en-US', { minimumFractionDigits: d, maximumFractionDigits: d });
};
const pct = (v) => {
    const n = parseFloat(v);
    return isNaN(n) ? '0%' : n.toFixed(2) + '%';
};
const p = (v) => {
    if (typeof v === 'string') return parseFloat(v.replace(/[,$]/g, '')) || 0;
    return parseFloat(v) || 0;
};

// ─── Currency Display Helper ───
const fmtInput = (v) => {
    if (!v && v !== 0) return '';
    const raw = String(v).replace(/[,$]/g, '');
    const n = parseFloat(raw);
    if (isNaN(n)) return String(v);
    if (raw.includes('.')) {
        const parts = raw.split('.');
        return '$' + parseInt(parts[0]).toLocaleString('en-US') + '.' + parts[1];
    }
    return '$' + n.toLocaleString('en-US', { maximumFractionDigits: 0 });
};

// ─── Gemini API Helper ───
const GEMINI_KEY = 'AIzaSyAWaae-wg0uAAa8gb389wNnx94Y_SGDek4';
const callGemini = async (apiKey, prompt, useGrounding = false) => {
    const key = apiKey || GEMINI_KEY;
    if (!key) throw new Error('No Gemini API key. Enter your key in the AI Tools tab.');
    const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${key}`;
    const payload = { contents: [{ parts: [{ text: prompt }] }] };
    if (useGrounding) payload.tools = [{ google_search: {} }];

    const res = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
    });
    if (!res.ok) {
        const errBody = await res.text();
        throw new Error(`Gemini API ${res.status}: ${errBody.substring(0, 300)}`);
    }
    const data = await res.json();
    let text = data.candidates?.[0]?.content?.parts?.[0]?.text || 'No response generated.';
    const chunks = data.candidates?.[0]?.groundingMetadata?.groundingChunks;
    if (chunks && chunks.length > 0) {
        text += '\n\n📚 **Sources:**\n' + chunks.map((c, i) =>
            `${i + 1}. [${c.web?.title || 'Source'}](${c.web?.uri || '#'})`
        ).join('\n');
    }
    return text;
};

// ─── Parse AI Response for Verdict ───
const parseAIResponse = (text) => {
    if (!text) return { verdict: '', summary: '', detail: text };
    const lines = text.split('\n');
    let verdict = '';
    let summaryLines = [];
    let detailLines = [];
    let inSummary = true;
    let summaryCount = 0;

    for (let i = 0; i < lines.length; i++) {
        const line = lines[i];
        const upper = line.toUpperCase().trim();
        // Extract verdict from first meaningful line
        if (!verdict && (upper.includes('VERDICT:') || upper.includes('RECOMMENDATION:') || upper.startsWith('**VERDICT') || upper.startsWith('**RECOMMENDATION'))) {
            verdict = line.replace(/\*\*/g, '').replace(/VERDICT:|RECOMMENDATION:/i, '').trim();
            continue;
        }
        // If we haven't found a verdict yet and it's a BUY/PASS/FAIL line
        if (!verdict && i === 0 && (upper.includes('BUY') || upper.includes('PASS') || upper.includes('STRONG BUY') || upper.includes('AVOID'))) {
            verdict = line.replace(/\*\*/g, '').trim();
            continue;
        }

        if (inSummary) {
            if (line.trim() === '') {
                if (summaryCount > 0) {
                    summaryCount++;
                    if (summaryCount >= 2) { inSummary = false; continue; }
                }
                summaryLines.push(line);
            } else {
                summaryCount = 1;
                summaryLines.push(line);
                // After 4 non-empty lines in summary, switch to detail
                if (summaryLines.filter(l => l.trim()).length >= 4) {
                    inSummary = false;
                }
            }
        } else {
            detailLines.push(line);
        }
    }

    // If no explicit verdict found, try to infer from content
    if (!verdict) {
        const full = text.toUpperCase();
        if (full.includes('STRONG BUY') || full.includes('HIGHLY RECOMMEND')) verdict = 'STRONG BUY';
        else if (full.includes('RECOMMEND PURCHASING') || full.includes('BUY RECOMMENDATION')) verdict = 'BUY';
        else if (full.includes('PASS ON THIS') || full.includes('WALK AWAY') || full.includes('AVOID')) verdict = 'PASS';
        else if (full.includes('PROCEED WITH CAUTION') || full.includes('MIXED')) verdict = 'MIXED / PROCEED WITH CAUTION';
        else verdict = 'Analysis Complete';
    }

    return {
        verdict,
        summary: summaryLines.join('\n').trim(),
        detail: detailLines.join('\n').trim()
    };
};

// ─── Render Markdown to HTML ───
const renderMd = (text) => {
    if (!text) return '';
    return text
        .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
        .replace(/\[([^\]]+)\]\((https?:\/\/[^\)]+)\)/g, '<a href="$2" target="_blank" class="text-blue-600 underline hover:text-blue-800">$1</a>')
        .replace(/^### (.*$)/gm, '<h3 class="font-bold text-lg mt-3 mb-1">$1</h3>')
        .replace(/^## (.*$)/gm, '<h2 class="font-bold text-xl mt-4 mb-2">$2</h2>')
        .replace(/^- (.*$)/gm, '<div class="flex gap-2 ml-2"><span>•</span><span>$1</span></div>')
        .replace(/^\* (.*$)/gm, '<div class="flex gap-2 ml-2"><span>•</span><span>$1</span></div>');
};

    useEffect(() => {

    const mgmtFee = egi * (p(managementPct) / 100);
    const totalExpenses = p(taxes) + p(insurance) + p(utilities) + p(maintenance) + p(otherExpense) + mgmtFee + annualHoa;
    const noi = egi - totalExpenses;

    const monthlyRate = p(interestRate) / 100 / 12;
    const totalPayments = p(loanTerm) * 12;
    const monthlyPayment = useMemo(() => {
        if (monthlyRate === 0 || p(financeAmount) === 0) return 0;
        return p(financeAmount) * (monthlyRate * Math.pow(1 + monthlyRate, totalPayments)) / (Math.pow(1 + monthlyRate, totalPayments) - 1);
    }, [financeAmount, monthlyRate, totalPayments]);
    const annualDebt = monthlyPayment * 12;

    const cashFlow = noi - annualDebt;
    const totalCashIn = p(downPayment) + p(closingCosts) + p(quickEstimate || rehabTotal());
    const cocReturn = totalCashIn > 0 ? (cashFlow / totalCashIn) * 100 : 0;
    const grm = grossRent > 0 ? p(offerPrice) / grossRent : 0;
    const dcr = annualDebt > 0 ? noi / annualDebt : 0;
    const capRate = p(offerPrice) > 0 ? (noi / p(offerPrice)) * 100 : 0;
    const onePercent = p(offerPrice) > 0 ? ((grossRent / 12) / p(offerPrice)) * 100 : 0;
    const fiftyPercent = grossIncome > 0 ? (totalExpenses / grossIncome) * 100 : 0;

    function rehabTotal() {
        const sum = (arr) => arr.reduce((s, r) => s + p(r.total), 0);
        return sum(exterior) + sum(kitchen) + sum(bathroom) + sum(general);
    }
    const globalRehab = p(quickEstimate) || rehabTotal();

    // 70% Rule
    const maxOffer70 = p(arv70) * 0.7 - globalRehab;

    // Flip Analysis
    const totalHolding = p(holdingMonths) * p(holdingCostMo);
    const sellingCosts = p(arvFlip) * (p(sellingCostPct) / 100);
    const totalFlipCost = p(offerPrice) + globalRehab + totalHolding + sellingCosts + p(closingCosts);
    const flipProfit = p(arvFlip) - totalFlipCost;
    const flipROI = totalFlipCost > 0 ? (flipProfit / totalFlipCost) * 100 : 0;

    // ─── Local Smart Score Engine (no AI needed) ───
    const smartScore = useMemo(() => {
        const hasData = p(offerPrice) > 0 && grossRent > 0;
        if (!hasData) return null;

        const metrics = [];

        // CoC Return (25 pts) - most important for cash investors
        const cocPts = cocReturn >= 15 ? 25 : cocReturn >= 12 ? 20 : cocReturn >= 10 ? 15 : cocReturn >= 6 ? 8 : cocReturn > 0 ? 4 : 0;
        metrics.push({ name: 'Cash-on-Cash', value: `${fmtDec(cocReturn)}%`, target: '>15%', pts: cocPts, max: 25,
            note: cocReturn >= 15 ? 'Excellent return on cash invested' : cocReturn >= 10 ? 'Decent return, but below ideal threshold' : cocReturn > 0 ? 'Weak return on invested capital' : 'Negative or zero return' });

        // Cap Rate (20 pts)
        const capPts = capRate >= 8 ? 20 : capRate >= 7 ? 17 : capRate >= 5 ? 12 : capRate >= 4 ? 6 : 0;
        metrics.push({ name: 'Cap Rate', value: `${fmtDec(capRate)}%`, target: '>7%', pts: capPts, max: 20,
            note: capRate >= 7 ? 'Strong cap rate for rental property' : capRate >= 5 ? 'Moderate cap rate, market dependent' : 'Low cap rate, likely appreciation play' });

        // DCR (20 pts)
        const dcrPts = dcr >= 1.5 ? 20 : dcr >= 1.3 ? 17 : dcr >= 1.1 ? 10 : dcr >= 1.0 ? 5 : 0;
        metrics.push({ name: 'Debt Coverage', value: fmtDec(dcr), target: '>1.3', pts: dcrPts, max: 20,
            note: dcr >= 1.3 ? 'Solid coverage, lenders will be comfortable' : dcr >= 1.0 ? 'Thin margin, any vacancy could cause negative cash flow' : 'Income does not cover debt payments' });

        // 1% Rule (15 pts)
        const onePctPts = onePercent >= 1.2 ? 15 : onePercent >= 1.0 ? 13 : onePercent >= 0.8 ? 8 : onePercent >= 0.6 ? 3 : 0;
        metrics.push({ name: '1% Rule', value: `${fmtDec(onePercent)}%`, target: '>1%', pts: onePctPts, max: 15,
            note: onePercent >= 1.0 ? 'Passes the 1% rule screen' : onePercent >= 0.8 ? 'Close but below 1% threshold' : 'Significantly below 1% rule' });

        // GRM (10 pts) - lower is better
        const grmPts = grm > 0 && grm <= 6 ? 10 : grm <= 8 ? 7 : grm <= 10 ? 4 : grm <= 12 ? 2 : 0;
        metrics.push({ name: 'GRM', value: fmtDec(grm), target: '<6', pts: grmPts, max: 10,
            note: grm <= 6 ? 'Excellent gross rent multiplier' : grm <= 8 ? 'Acceptable GRM' : 'High GRM, price may be too high relative to rents' });

        // Cash Flow (10 pts) - per unit per month
        const unitCount = Math.max(units.filter(u => p(u.rent) > 0).length, 1);
        const cfPerUnit = (cashFlow / 12) / unitCount;
        const cfPts = cfPerUnit >= 200 ? 10 : cfPerUnit >= 100 ? 7 : cfPerUnit > 0 ? 4 : 0;
        metrics.push({ name: 'Cash Flow', value: `${fmt(cashFlow / 12)}/mo`, target: '>$200/unit', pts: cfPts, max: 10,
            note: cfPerUnit >= 200 ? `Strong cash flow at ${fmt(cfPerUnit)}/unit/mo` : cfPerUnit > 0 ? `Thin cash flow at ${fmt(cfPerUnit)}/unit/mo` : 'Negative cash flow' });

        const total = metrics.reduce((s, m) => s + m.pts, 0);
        const maxTotal = 100;
        const pct = Math.round((total / maxTotal) * 100);

        let verdict, color, summary;
        if (pct >= 80) {
            verdict = 'STRONG BUY';
            color = '#059669';
            summary = 'This deal scores well across all key investment metrics. The numbers support a strong rental investment.';
        } else if (pct >= 65) {
            verdict = 'BUY';
            color = '#10b981';
            summary = 'Solid fundamentals with minor weaknesses. Worth pursuing with attention to the flagged areas.';
        } else if (pct >= 55) {
            verdict = 'MIXED';
            color = '#f59e0b';
            summary = 'Some metrics pass but others raise concerns. Proceed only if you can improve the weak areas (negotiate price, raise rents, reduce expenses).';
        } else if (pct >= 40) {
            verdict = 'CAUTION';
            color = '#ef4444';
            summary = 'Multiple metrics are below investment thresholds. This deal likely needs significant price reduction or rent increases to work.';
        } else {
            verdict = 'PASS';
            color = '#dc2626';
            summary = 'The numbers do not support this as a viable investment at the current terms.';
        }

        const passing = metrics.filter(m => m.pts >= m.max * 0.7);
        const failing = metrics.filter(m => m.pts < m.max * 0.4);
        let detail = '';
        if (passing.length > 0) detail += 'Strengths: ' + passing.map(m => m.name).join(', ') + '. ';
        if (failing.length > 0) detail += 'Weaknesses: ' + failing.map(m => m.name).join(', ') + '.';

        return { metrics, total, maxTotal, pct, verdict, color, summary, detail };
    }, [cocReturn, capRate, dcr, onePercent, grm, cashFlow, offerPrice, grossRent, units]);

    // ─── Rehab Row Updater ───
    const updateRehab = useCallback((setter, idx, field, val) => {
        setter(prev => {
            const next = [...prev];
            next[idx] = { ...next[idx], [field]: val };
            if (field === 'qty' || field === 'unit') {

    // ─── Amortization Schedule ───
    const amortSchedule = useMemo(() => {
        if (p(financeAmount) === 0 || monthlyRate === 0) return [];
        let balance = p(financeAmount);
        const rows = [];
        for (let i = 1; i <= totalPayments && i <= 360; i++) {
            const interest = balance * monthlyRate;
            const principal = monthlyPayment - interest;
            balance -= principal;
            rows.push({ month: i, payment: monthlyPayment, principal, interest, balance: Math.max(0, balance) });
        }
        return rows;
    }, [financeAmount, monthlyRate, totalPayments, monthlyPayment]);

    const yearSummary = useMemo(() => {
        const years = [];
        for (let y = 0; y < Math.ceil(amortSchedule.length / 12); y++) {
            const slice = amortSchedule.slice(y * 12, (y + 1) * 12);
            years.push({
                year: y + 1,
                totalPaid: slice.reduce((s, r) => s + r.payment, 0),
                totalPrincipal: slice.reduce((s, r) => s + r.principal, 0),
                totalInterest: slice.reduce((s, r) => s + r.interest, 0),
                endBalance: slice[slice.length - 1]?.balance || 0
            });
        }
        return years;
    }, [amortSchedule]);

    const buildPrompt = useCallback((type) => {
        const propContext = `Property: ${propertyName || 'Unknown'} at ${propertyAddress || 'N/A'}. Offer: ${fmt(offerPrice)}, Gross Rent: ${fmt(grossRent)}, NOI: ${fmt(noi)}, Cap Rate: ${fmtDec(capRate)}%, CoC: ${fmtDec(cocReturn)}%, GRM: ${fmtDec(grm)}, DCR: ${fmtDec(dcr)}, Rehab Est: ${fmt(globalRehab)}.`;
        if (type === 'deal') {
            return `You are an expert real estate investment analyst. Analyze this deal.\n\n${propContext}\n\nIMPORTANT FORMAT: Your response MUST follow this exact structure:\n\nLine 1: "VERDICT: [BUY / PASS / MIXED]" (just the word)\n\nThen a blank line, then a 2-3 sentence executive summary of the overall assessment.\n\nThen a blank line, then a detailed breakdown evaluating against: CoC Return >15%, GRM <6, DCR >1.3, 1% Rule (${fmtDec(onePercent)}%), 50% Rule (${fmtDec(fiftyPercent)}%), Cap Rate. Include 3-5 key factors and risks.`;
        } else if (type === 'listing') {
            return `Write a compelling MLS-style property listing description for:\n${propertyName} at ${propertyAddress}\nUnits: ${units.map(u => `${u.beds}bd/${u.baths}ba ${u.sqft}sqft`).join(', ')}\nBuildings: ${buildings.map(b => b.name + ' ' + b.type).join(', ')}\n\nMake it professional, highlight investment potential, and use vivid but accurate language. 150-200 words.`;
        } else if (type === 'rehab') {
            return `You are a real estate rehab advisor. Given this property:\n${propContext}\nCurrent rehab estimate: ${fmt(globalRehab)}\n\nIMPORTANT FORMAT: Start with "VERDICT: [REASONABLE / HIGH / LOW / NEEDS REVIEW]"\n\nThen a 2-3 sentence summary of the rehab budget assessment.\n\nThen provide a prioritized rehab strategy. Which improvements give the best ROI? Suggest budget allocation percentages. Flag any red flags.`;
        } else if (type === 'market') {
            return `Provide current, real-time market intelligence for a real estate investor looking at ${propertyAddress || 'a rental property'}.\n${propContext}\n\nIMPORTANT FORMAT: Start with "VERDICT: [FAVORABLE / UNFAVORABLE / NEUTRAL]" for the market outlook.\n\nThen a 2-3 sentence summary.\n\nThen cover: current median home prices and trends, average rental rates and vacancy rates, population and job growth, average cap rates, key risks, and 12-month outlook. Be specific with numbers and cite sources. Keep it concise.`;
        }
        return '';
    }, [propertyName, propertyAddress, offerPrice, grossRent, noi, capRate, cocReturn, grm, dcr, globalRehab, onePercent, fiftyPercent, units, buildings]);

    const runAI = useCallback(async (type) => {
        const cacheKey = getCacheKey(type);
        if (aiCacheRef.current[cacheKey]) {
            setAiType(type);
            setAiResult(aiCacheRef.current[cacheKey]);
            return;
        }
        setAiLoading(true);
        setAiResult('');
        setAiType(type);
        try {
            const prompt = buildPrompt(type);
            const useGrounding = (type === 'market' || type === 'deal');
            const result = await callGemini(geminiKey, prompt, useGrounding);
            aiCacheRef.current[cacheKey] = result;
            trackCall();
            setAiResult(result);
        } catch (err) {
            setAiResult('Error: ' + err.message);
        }
        setAiLoading(false);
    }, [geminiKey, buildPrompt, getCacheKey, trackCall]);

    // ─── Full Analysis (1 API call for deal + market + rehab) ───
    const [fullAnalysisResults, setFullAnalysisResults] = useState(null);
    const runFullAnalysis = useCallback(async () => {
        setAiLoading(true);
        setAiResult('');
        setAiType('full');
        setFullAnalysisResults(null);
        try {
            const propContext = `Property: ${propertyName || 'Unknown'} at ${propertyAddress || 'N/A'}. Offer: ${fmt(offerPrice)}, Gross Rent: ${fmt(grossRent)}, NOI: ${fmt(noi)}, Cap Rate: ${fmtDec(capRate)}%, CoC: ${fmtDec(cocReturn)}%, GRM: ${fmtDec(grm)}, DCR: ${fmtDec(dcr)}, Rehab Est: ${fmt(globalRehab)}.`;
            const combinedPrompt = `You are an expert real estate investment analyst. Perform a comprehensive analysis of this property in ONE response. Use real market data.\n\n${propContext}\n\nYou MUST structure your response with these EXACT section headers:\n\n===DEAL ANALYSIS===\nLine 1: "VERDICT: [BUY / PASS / MIXED]"\nThen 2-3 sentence executive summary.\nThen detailed breakdown: CoC Return >15%, GRM <6, DCR >1.3, 1% Rule (${fmtDec(onePercent)}%), 50% Rule (${fmtDec(fiftyPercent)}%), Cap Rate. 3-5 key factors and risks.\n\n===MARKET INTEL===\nLine 1: "VERDICT: [FAVORABLE / UNFAVORABLE / NEUTRAL]"\nThen 2-3 sentence summary.\nThen: median home prices/trends, rental rates, vacancy rates, population/job growth, avg cap rates, key risks, 12-month outlook.\n\n===REHAB ASSESSMENT===\nLine 1: "VERDICT: [REASONABLE / HIGH / LOW / NEEDS REVIEW]"\nThen 2-3 sentence summary.\nThen prioritized rehab strategy with ROI ranking and budget allocation percentages.`;
            const result = await callGemini(geminiKey, combinedPrompt, true);
            trackCall();

            const sections = {};
            const dealMatch = result.match(/===DEAL ANALYSIS===([\s\S]*?)(?====MARKET|$)/);
            const marketMatch = result.match(/===MARKET INTEL===([\s\S]*?)(?====REHAB|$)/);
            const rehabMatch = result.match(/===REHAB ASSESSMENT===([\s\S]*?)$/);
            if (dealMatch) { sections.deal = dealMatch[1].trim(); aiCacheRef.current[getCacheKey('deal')] = sections.deal; }
            if (marketMatch) { sections.market = marketMatch[1].trim(); aiCacheRef.current[getCacheKey('market')] = sections.market; }
            if (rehabMatch) { sections.rehab = rehabMatch[1].trim(); aiCacheRef.current[getCacheKey('rehab')] = sections.rehab; }
            setFullAnalysisResults(sections);
            setAiResult(result);
        } catch (err) {
            setAiResult('Error: ' + err.message);
        }
        setAiLoading(false);
    }, [geminiKey, propertyName, propertyAddress, offerPrice, grossRent, noi, capRate, cocReturn, grm, dcr, globalRehab, onePercent, fiftyPercent, getCacheKey, trackCall]);

                                    </tbody>
                                </table>
                                {amortSchedule.length > 60 && <p className="text-xs text-gray-400 mt-2">Showing first 60 of {amortSchedule.length} months. Use Annual view for full picture.</p>}
                            </div>
                        ) : (
                            <table className="w-full text-sm">
                                <thead><tr className="text-xs text-gray-500"><th className="pb-2 text-left">Year</th><th className="pb-2 text-right">Total Paid</th><th className="pb-2 text-right">Principal</th><th className="pb-2 text-right">Interest</th><th className="pb-2 text-right">End Balance</th></tr></thead>
                                <tbody>
                                    {yearSummary.map(y => (
                                        <tr key={y.year} className="border-t border-gray-100">
                                            <td className="py-1.5 font-medium">{y.year}</td>
                                            <td className="text-right">{fmt(y.totalPaid)}</td>
                                            <td className="text-right">{fmt(y.totalPrincipal)}</td>
                                            <td className="text-right">{fmt(y.totalInterest)}</td>
                                            <td className="text-right">{fmt(y.endBalance)}</td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        )}
                    </Section>
                </div>
            )}

            {/* ─── FLIPPING TAB ─── */}
            {tab === 'flipping' && (
                <div className="fade-in">
                    <div className="flex justify-end mb-3"><ClearBtn onClick={clearFlipTab} /></div>
                    <Section title="70% Rule Quick Check" color="red" onClear={() => setArv70('')}>
                        <div className="grid grid-cols-2 md:grid-cols-3 gap-4">
                            <CurrencyInput label="ARV (70% Rule)" value={arv70} onChange={setArv70} prefix="$" />
                            <div className="flex flex-col justify-end">
                                <div className="text-xs text-gray-500">Max Offer (70% ARV - Rehab)</div>
                                <div className={`text-xl font-bold ${maxOffer70 >= p(offerPrice) ? 'text-green-600' : 'text-red-600'}`}>{fmt(maxOffer70)}</div>
                            </div>
                            <div className="flex flex-col justify-end">
                                <div className="text-xs text-gray-500">vs. Your Offer</div>
                                <div className={`text-sm font-medium ${maxOffer70 >= p(offerPrice) ? 'text-green-600' : 'text-red-600'}`}>
                                    {maxOffer70 >= p(offerPrice) ? `${fmt(maxOffer70 - p(offerPrice))} under max` : `${fmt(p(offerPrice) - maxOffer70)} OVER max`}
                                </div>
                            </div>
                        </div>
                    </Section>
                    <Section title="Flip Breakdown" color="amber" onClear={clearFlip}>
                        <div className="grid grid-cols-2 md:grid-cols-4 gap-4 mb-4">
                            <CurrencyInput label="After Repair Value" value={arvFlip} onChange={setArvFlip} prefix="$" />
                            <Input label="Holding Months" value={holdingMonths} onChange={setHoldingMonths} />
                            <CurrencyInput label="Holding Cost/Mo" value={holdingCostMo} onChange={setHoldingCostMo} prefix="$" />
                            <Input label="Selling Costs" value={sellingCostPct} onChange={setSellingCostPct} suffix="%" />
                        </div>
                        <div className="bg-gray-50 rounded-lg p-4 grid grid-cols-2 md:grid-cols-3 gap-3 text-sm">
                            <div><span className="text-gray-500">Purchase:</span> <span className="font-medium">{fmt(offerPrice)}</span></div>
                            <div><span className="text-gray-500">Rehab:</span> <span className="font-medium">{fmt(globalRehab)}</span></div>
                            <div><span className="text-gray-500">Holding:</span> <span className="font-medium">{fmt(totalHolding)}</span></div>
                            <div><span className="text-gray-500">Selling:</span> <span className="font-medium">{fmt(sellingCosts)}</span></div>
                            <div><span className="text-gray-500">Closing:</span> <span className="font-medium">{fmt(closingCosts)}</span></div>
                            <div><span className="text-gray-500">Total Cost:</span> <span className="font-bold">{fmt(totalFlipCost)}</span></div>
                        </div>
                        <div className="mt-4 flex gap-6">
                            <div className={`text-2xl font-bold ${flipProfit >= 0 ? 'text-green-600' : 'text-red-600'}`}>
                                Profit: {fmt(flipProfit)}
                            </div>
                            <div className={`text-2xl font-bold ${flipROI >= 15 ? 'text-green-600' : 'text-amber-600'}`}>
                                ROI: {fmtDec(flipROI)}%
                            </div>
                        </div>
                    </Section>
                </div>
            )}

            {/* ─── AI TOOLS TAB ─── */}
            {tab === 'ai' && (
                <div className="fade-in">
                    <div className="flex items-center justify-between mb-4">
                        <div className="text-xs text-gray-500">
                            API calls today: <span className={aiCallCount >= 18 ? 'text-red-600 font-bold' : aiCallCount >= 14 ? 'text-yellow-600 font-semibold' : 'text-green-600 font-semibold'}>{aiCallCount}</span> / 20 free
                        </div>
                        {Object.keys(aiCacheRef.current).length > 0 && (
                            <button onClick={() => { aiCacheRef.current = {}; setAiResult(''); setFullAnalysisResults(null); }}
                                className="text-xs text-gray-400 hover:text-red-500 transition-colors">Clear cache</button>
                        )}
                    </div>
                    <button onClick={runFullAnalysis} disabled={aiLoading}
                        className="w-full mb-4 bg-gradient-to-r from-purple-600 to-indigo-600 text-white rounded-xl p-4 hover:from-purple-700 hover:to-indigo-700 transition-all disabled:opacity-50 disabled:cursor-not-allowed shadow-lg">
                        <div className="text-lg font-bold">🚀 Full Analysis</div>
                        <div className="text-xs text-purple-200 mt-1">Deal + Market + Rehab in 1 API call (saves 2 requests)</div>
                    </button>
                    <div className="grid grid-cols-2 md:grid-cols-4 gap-3 mb-6">
                        {[
                            {type:'deal', icon:'🎯', title:'Deal', desc:'Buy/pass verdict'},
                            {type:'listing', icon:'📝', title:'Listing', desc:'MLS-style copy'},
                            {type:'rehab', icon:'🔨', title:'Rehab', desc:'ROI strategy'},
                            {type:'market', icon:'📊', title:'Market', desc:'Live intel'}
                        ].map(ai => (
                            <button key={ai.type} onClick={() => runAI(ai.type)} disabled={aiLoading}
                                className="ai-glow bg-white rounded-xl p-4 text-left hover:shadow-lg transition-all disabled:opacity-50 disabled:cursor-not-allowed relative">
                                {aiCacheRef.current[getCacheKey(ai.type)] && <span className="absolute top-2 right-2 text-green-500 text-xs" title="Cached - no API call needed">⚡</span>}
                                <div className="text-xl mb-1">{ai.icon}</div>
                                <div className="font-semibold text-gray-800 text-sm">{ai.title}</div>
                                <div className="text-xs text-gray-500">{ai.desc}</div>
                            </button>
                        ))}
                    </div>
                    {aiLoading && (
                        <div className="bg-white rounded-xl p-8 text-center shadow-md">
                            <div className="animate-spin w-8 h-8 border-4 border-purple-500 border-t-transparent rounded-full mx-auto"></div>
                            <p className="text-gray-500 mt-3 text-sm">Analyzing with Gemini...</p>
                        </div>
                    )}
                    {renderAIResult()}
                </div>
            )}

            {/* Footer */}
            <div className="text-center text-xs text-gray-400 mt-8 pb-4">
                Graves Realty Analyzer v3.0 | Data saved locally in your browser
            </div>
        </div>
        </div>
    );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
